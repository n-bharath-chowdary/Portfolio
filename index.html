<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio - N Bharath Chowdary</title>
    <meta
      name="description"
      content="Portfolio of N Bharath Chowdary - an AI/ML engineer from Yadgir. Explore top AI projects, ML solutions, and web/app development work."
    />
    <meta
      name="keywords"
      content="n bharath, bharath chowdary, n bharath chowdary, ai, ml engineer, yadgir, top ai ml engineers, portfolio, ai,ml portfolio"
    />
    <meta name="author" content="N Bharath Chowdary" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="shortcut icon" href="images/icon-dark.png" type="image/x-icon" />
    <style>
      .highlight {
        color: var(--color-accent) !important;
        border-bottom: 2px solid var(--color-accent) !important;
      }
      .fade-in {
        animation: fadeIn 2s ease-in-out forwards;
        opacity: 0;
      }
      .bounce {
        animation: bounce 2s infinite;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/@babel/standalone/babel.min.js"
    ></script>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function ThemeToggle({ theme, toggleTheme }) {
        return (
          <button
            className="theme-toggle"
            onClick={toggleTheme}
            aria-label="Toggle Theme"
          >
            {theme === "light" ? "🌚" : "🌞"}
          </button>
        );
      }

      function Nav({ sections, activeSection, onNavClick }) {
        return (
          <header>
            <nav className="container" aria-label="Primary">
              <div className="logo">
                <img
                  src="images/icon.png"
                  alt="icon"
                  className="logo-img light"
                />
                <img
                  src="images/icon-dark.png"
                  alt="icon"
                  className="logo-img dark"
                />
              </div>
              <ul className="nav-links">
                {sections.map((section) => (
                  <li key={section.id}>
                    <a
                      href={`#${section.id}`}
                      onClick={(e) => {
                        e.preventDefault();
                        onNavClick(section.id);
                      }}
                      className={
                        activeSection === section.id ? "highlight" : ""
                      }
                    >
                      {section.label}
                    </a>
                  </li>
                ))}
              </ul>
            </nav>
          </header>
        );
      }

      function Home() {
        return (
          <section id="home">
            <div className="hero-text fade-in">
              <h1 className="hero-name bounce">
                Hello, I'm <br />N Bharath
              </h1>
              <p className="subtitle">
                Final semester BCA student passionate about building impactful
                AI/ML solutions and meaningful user experiences.
              </p>
              <a href="assets/resume.pdf" download className="hero-cta">
                RESUME
              </a>
              
            </div>
            <div className="hero-image">
              <img
                src="images/profile.png"
                alt="N Bharath chowdary"
                className="fade-in"
              />
            </div>
            <div className="section-divider"></div>
          </section>
        );
      }

      function About() {
        return (
          <section
            id="about"
            style={{
              display: "flex",
              flexWrap: "wrap",
              alignItems: "center",
              gap: "2rem",
            }}
          >
            <div id="models" style={{ flex: "1 1 300px", maxWidth: "500px" }}>
              <img
                src="images/Animation-Light.gif"
                alt="AI Visual"
                className="model-light"
                style={{ width: "100%", borderRadius: "1rem" }}
              />
              <img
                src="images/Animation-dark.gif"
                alt="AI Visual"
                className="model-dark"
                style={{ width: "100%", borderRadius: "1rem" }}
              />
            </div>
            <div style={{ flex: "1 1 400px", maxWidth: "600px" }}>
              <h2 className="section-title">About Me</h2>
              <p>
                AI/ML Engineer | App & Web Developer | Innovator | Problem
                Solver
                <br />
                I'm a passionate Bachelor of Computer Applications (BCA) student
                at Govt. Degree College, Yadgir, driven by a mission to build
                AI-powered solutions that solve real-world problems.
              </p>
              <p>
                I have hands-on experience building scalable applications using
                modern frameworks and enjoy integrating AI into real-time
                systems. My portfolio includes projects in steganography,
                currency detection, and deep learning. I'm also building an
                AI-powered personal assistant and an ed-tech toy startup aimed
                at helping kids reduce screen time.
              </p>
              <p>
                I thrive in collaborative environments, love to innovate, and
                believe in lifelong learning. My goal is to bring meaningful
                tech to life while staying grounded in ethics, empathy, and
                creativity.
              </p>
            </div>
            <div className="section-divider"></div>
          </section>
        );
      }

      function Projects() {
        const projects = [
          {
            id: 1,
            title: "Rekon AI",
            description:
              "An advanced AI assistant system powered by real-time face recognition and voice interaction, designed to recognize individuals, communicate using speech, and adapt dynamically to new users. The system combines computer vision, natural language processing, and local LLMs to create a JARVIS-like experience.",
            code: "https://github.com/n-bharath-chowdary/rekonai",
            live: "https://github.com/n-bharath-chowdary/rekonai",
          },
          {
            id: 2,
            title: "DermAI",
            description:
              "DermAI – AI-Powered Skin Disease Detection & Assistant DermAI is an intelligent skin disease detection assistant that identifies skin conditions from images and provides detailed medical insights. Users can either capture images via mobile IP Webcam or upload files directly, making the solution highly accessible for early diagnosis and awareness.",
            code: "https://github.com/n-bharath-chowdary/dermai",
            live: "https://n-bharath-chowdary.github.io/DermAI/",
          },
          {
            id: 3,
            title: "PixelSafe",
            description:
              "PixelSafe is an AI-powered web tool for steganography—hiding secret messages or images inside other media files. It's built for privacy enthusiasts, cybersecurity researchers, and curious minds who want to explore the art of digital secrecy.",
            code: "https://github.com/n-bharath-chowdary/pixelsafe",
            live: "https://n-bharath-chowdary.github.io/PixelSafe/",
          },
          {
            id: 4,
            title: "Edunexa",
            description:
              "Smart Communication Platform for Universities EduNexa is a university-exclusive communication platform designed to streamline information flow between students, faculty, and administration. From the Vice-Chancellor to individual students, everyone can share announcements, media, documents, and updates — all within a controlled, role-based access system.",
            code: "https://github.com/n-bharath-chowdary/edunexa",
            live: "https://github.com/n-bharath-chowdary/edunexa",
          },
          {
            id: 5,
            title: "Crime Scene Detector",
            description:
              "An AI-powered video classification system designed to detect and categorize crime scenes into Arrest, Abuse, Arson, and Assault. This project leverages a 3D Convolutional Neural Network (3D CNN) to learn both spatial and temporal features from video clips, enabling efficient and accurate crime detection.",
            code: "https://github.com/n-bharath-chowdary/Crime-Scene-Detector",
            live: "https://github.com/n-bharath-chowdary/crime-scene-detector",
          },
          {
            id: 6,
            title: "Brain Stroke Detection",
            description:
              "A powerful deep learning-based solution that detects brain strokes from MRI images using convolutional neural networks (CNN). The model takes raw medical imaging data and outputs a high-confidence stroke classification — fast, reliable, and accurate.",
            code: "https://github.com/n-bharath-chowdary/brain-stroke-detection",
            live: "https://github.com/n-bharath-chowdary/brain-stroke-detector",
          },
        ];

        return (
          <section id="projects">
            <h2 className="section-title">Projects</h2>
            <div className="cards">
              {projects.map(({ id, title, description, code, live }) => (
                <article className="card fade-in" key={id}>
                  <h3>{title}</h3>
                  <p>{description}</p>
                  <div style={{ marginTop: "0.75rem" }}>
                    <a className="btn" href={code} traget="_blank">
                      Code
                    </a>
                    <a
                      className="btn"
                      href={live}
                      traget="_blank"
                      style={{ marginLeft: "1rem" }}
                    >
                      Live
                    </a>
                  </div>
                </article>
              ))}
            </div>
          </section>
        );
      }

      function Experience() {
        const experiences = [
          {
            title: "MindsNxt – AI Research Assistant",
            duration: "5 months",
            description:
              "Led development of a breast cancer detection model (98.78% accuracy) and MedGPT assistant deployed on AWS.",
          },
          {
            title: "Virtunex – App Developer Intern",
            duration: "1 month",
            description:
              "Boosted app speed by 38% by integrating optimized Java modules; enhanced backend and UX performance.",
          },
          {
            title: "Afame Technologies – Web Dev Intern",
            duration: "2 months",
            description:
              "Improved website responsiveness by 15% using HTML, CSS, JS; recognized among 120+ interns.",
          },
          {
            title: "Workfall – Talent Acquisition Intern",
            duration: "3 months",
            description:
              "Sourced 650+ tech leads via LinkedIn & tools; enhanced hiring pipelines through data strategy & communication.",
          },
        ];

        return (
          <section id="experience">
            <h2 className="section-title">Experience</h2>
            <div className="cards">
              {experiences.map(({ title, duration, description }, i) => (
                <article className="card fade-in" key={i}>
                  <h3>{title}</h3>
                  <p>
                    <strong>Duration:</strong> {duration}
                  </p>
                  <p>{description}</p>
                </article>
              ))}
            </div>
          </section>
        );
      }

      function Skills() {
        const technicalSkills = [
          "Python",
          "SQL",
          "C/C++",
          "Java",
          "HTML/CSS/JS",
        ];
        const softSkills = [
          "Effective Communicator",
          "Problem Solving",
          "Teamwork",
          "Leadership",
          "Time Management",
        ];
        const techStack = [
          "Airtifical Intelligence",
          "Machine Learning",
          "Deep Learning",
          "App Development",
          "Image Processing",
        ];
        const hobbies = [
          "Coding",
          "Gaming",
          "Cricket",
          "Travelling",
          "Exploring Tech",
        ];

        const renderSkillSection = (title, skills) => (
          <div style={{ marginBottom: "2rem" }}>
            <h3 style={{ marginBottom: "1rem", color: "var(--color-heads)" }}>
              {title}
            </h3>
            <div className="skills-list">
              {skills.map((skill) => (
                <span key={skill} className="skill-badge fade-in">
                  {skill}
                </span>
              ))}
            </div>
          </div>
        );

        return (
          <section id="skills">
            <h2 className="section-title">Skills</h2>
            {renderSkillSection("Technical Skills", technicalSkills)}
            {renderSkillSection("Soft Skills", softSkills)}
            {renderSkillSection("Tech Stack", techStack)}
            {renderSkillSection("Hobbies & Interests", hobbies)}
          </section>
        );
      }

      // import '@fortawesome/fontawesome-free/css/all.min.css';

      function Connect() {
        const handleSubmit = (e) => {
          e.preventDefault();
          const subject = e.target.subject.value;
          const message = e.target.message.value;
          if (!subject || !message) {
            alert("Please fill out both Subject and Message.");
            return;
          }
          const mailtoLink = `mailto:bharath.n18189@gmail.com?subject=${encodeURIComponent(
            subject
          )}&body=${encodeURIComponent(message)}`;
          // window.open(mailtoLink, "_blank"),
          window.location.href = mailtoLink;
        };

        return (
          <section id="connect" style={{ textAlign: "center" }}>
            <h2 className="section-title">Connect</h2>
            <p>
              Feel free to reach out to me via social media or send a message:
            </p>
            <form
              className="contact-form"
              onSubmit={handleSubmit}
              style={{ margin: "0 auto" }}
            >
              <input
                type="text"
                name="subject"
                placeholder="Subject"
                required
              />
              <textarea
                name="message"
                placeholder="Your Message"
                rows="5"
                required
              ></textarea>
              <button type="submit">Send</button>
            </form>
            <div
              className="social-icons"
              style={{ marginTop: "2rem", fontSize: "1.8rem" }}
            >
              <a
                href="https://linkedin.com/in/n-bharath-chowdary"
                className="social-link"
                aria-label="LinkedIn"
                target="_blank"
                alt="LinkedIn"
              >
                <i className="fa-brands fa-linkedin"></i>
              </a>
              <a
                href="https://github.com/n-bharath-chowdary"
                className="social-link"
                aria-label="GitHub"
                target="_blank"
                alt="GitHub"
              >
                <i className="fab fa-github"></i>
              </a>
              <a
                href="https://leetcode.com/u/n-bharath-chowdary"
                className="social-link"
                aria-label="LeetCode"
                target="_blank"
                alt="LeetCode"
              >
                <i className="fas fa-code"></i>
              </a>
              <a
                href="https://wa.me/919353146515"
                className="social-link"
                aria-label="WhatsApp"
                target="_blank"
                alt="WhatsApp"
              >
                <i className="fab fa-whatsapp"></i>
              </a>
              <a
                href="https://x.com/NBharathChowda3"
                className="social-link"
                aria-label="X (Twitter)"
                target="_blank"
                alt="X"
              >
                <i className="fab fa-twitter"></i>
              </a>
              <a
                href="https://www.facebook.com/profile.php?id=100091346126554"
                className="social-link"
                aria-label="Facebook"
                target="_blank"
                alt="Facebook"
              >
                <i className="fab fa-facebook"></i>
              </a>
              <a
                href="https://www.instagram.com/nbharath_chowdary/y"
                className="social-link"
                aria-label="Instagram"
                target="_blank"
                alt="Instagram"
              >
                <i className="fab fa-instagram"></i>
              </a>
            </div>
          </section>
        );
      }

      function App() {
        const sections = [
          { id: "home", label: "Home" },
          { id: "about", label: "About" },
          { id: "projects", label: "Projects" },
          { id: "skills", label: "Skills" },
          { id: "experience", label: "Experience"},
          { id: "connect", label: "Connect" },
        ];
        const [active, setActive] = useState("home");
        const [theme, setTheme] = useState("light");

        const toggleTheme = () => {
          const next = theme === "light" ? "dark" : "light";
          setTheme(next);
          document.body.setAttribute("data-theme", next);
        };

        const scrollToSection = (id) => {
          const el = document.getElementById(id);
          if (el) {
            el.focus({ preventScroll: true });
            window.scrollTo({ top: el.offsetTop - 80, behavior: "smooth" });
            setActive(id);
          }
        };

        useEffect(() => {
          function onScroll() {
            const scrollPosition = window.scrollY + 100;
            let currentSection = "home";
            for (const section of sections) {
              const el = document.getElementById(section.id);
              if (el && el.offsetTop <= scrollPosition) {
                currentSection = section.id;
              }
            }
            setActive(currentSection);
          }
          window.addEventListener("scroll", onScroll);
          return () => window.removeEventListener("scroll", onScroll);
        }, []);

        return (
          <>
            <ThemeToggle theme={theme} toggleTheme={toggleTheme} />
            <Nav
              sections={sections}
              activeSection={active}
              onNavClick={scrollToSection}
            />
            <main>
              <Home />
              <About />
              <Projects />
              <Skills />
              <Experience />
              <Connect />
            </main>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
